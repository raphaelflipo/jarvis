name: Jarvis Local web
on:
  push:
    paths: ['local-app/**', 'tests/test_local_app.mjs', '.github/workflows/web-local.yml']
  pull_request:
    paths: ['local-app/**', 'tests/test_local_app.mjs', '.github/workflows/web-local.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/test_local_app.mjs local-app/tests/*.test.mjs
