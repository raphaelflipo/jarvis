name: Réception native V3
on:
  push:
    branches: [verification-native-v3-fdaa834]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { ref: fd2cfe36168d87d48dbfbcf7fde76fbb9c935984, persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pillow
      - run: python native/prepare.py
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle -p native/android assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local inference, cache and history on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            adb install native/android/app/build/outputs/apk/debug/app-debug.apk
            adb install native/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w io.github.raphaelflipo.jarvis.test/androidx.test.runner.AndroidJUnitRunner | tee android-test.txt
            adb shell run-as io.github.raphaelflipo.jarvis cat files/online.json > android-online.json
            adb shell run-as io.github.raphaelflipo.jarvis cat files/offline.json > android-offline.json
            python -c "import pathlib; assert 'OK (2 tests)' in pathlib.Path('android-test.txt').read_text(); import json; assert json.load(open('android-online.json'))['ok']; assert json.load(open('android-offline.json'))['ok']"
