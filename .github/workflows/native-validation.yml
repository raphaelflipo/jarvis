name: Native builds and local inference
on:
  workflow_dispatch:
    inputs:
      stage_release:
        description: Copier les paquets vérifiés dans la release brouillon
        type: boolean
        default: false
  push:
    branches: ['release/native-finalization-*', 'codex/native-finalization-*']
    paths: ['jarvis/**', 'macos/**', 'native/**', 'local-app/**', 'tests/**', 'requirements*']
permissions:
  contents: read
jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements-macos.lock
      - name: Verify backend and recovery regressions
        run: |
          python tests/test_offline.py > backend-tests.txt
          python -m unittest discover -s tests -p test_release_quality.py
          python -m unittest discover -s tests -p test_packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backend-macOS
          path: backend-tests.txt
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pillow
      - run: python native/prepare.py
      - run: npm ci
        working-directory: native/windows
      - run: npm run dist
        working-directory: native/windows
      - name: Install and verify the packaged application twice
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v3.3.0-rc.1 --pattern Jarvis-3.3.0-rc.1-Windows-x64-Setup.exe --dir "$env:RUNNER_TEMP/previous-jarvis"
          $env:GH_TOKEN = $null
          $previous = (Get-ChildItem "$env:RUNNER_TEMP/previous-jarvis/*.exe")[0].FullName
          Start-Process -Wait -FilePath $previous -ArgumentList '/S'
          $exe = "$env:LOCALAPPDATA\Programs\Jarvis\Jarvis.exe"
          $env:JARVIS_TEST_PROFILE = $null
          $env:JARVIS_TEST_REPORT = "$env:GITHUB_WORKSPACE/previous.json"
          $env:JARVIS_TEST_OFFLINE = '0'
          $old = Start-Process -PassThru -FilePath $exe
          if (!$old.WaitForExit(660000)) { $old.Kill(); throw 'Previous version timeout' }
          if (!(Get-Content $env:JARVIS_TEST_REPORT | ConvertFrom-Json).ok) { throw 'Previous version failed' }
          $installer = (Get-ChildItem native/windows/dist/*Setup.exe)[0].FullName
          Start-Process -Wait -FilePath $installer -ArgumentList '/S'
          if (!(Test-Path $exe)) { throw 'Installed application missing' }
          foreach ($phase in @('offline','online')) {
            $env:JARVIS_TEST_REPORT = "$env:GITHUB_WORKSPACE\$phase.json"
            $env:JARVIS_TEST_OFFLINE = if ($phase -eq 'offline') {'1'} else {'0'}
            $process = Start-Process -PassThru -FilePath $exe
            if (!$process.WaitForExit(660000)) { $process.Kill(); throw 'Inference timeout' }
            $report = Get-Content $env:JARVIS_TEST_REPORT | ConvertFrom-Json
            if (!$report.ok) { throw ($report | ConvertTo-Json) }
          }
          Get-AuthenticodeSignature $installer | Format-List Status,StatusMessage | Out-File signature.txt
          Get-FileHash $installer -Algorithm SHA256 | Format-List | Out-File sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-x64
          path: |
            native/windows/dist/*Setup.exe
            online.json
            offline.json
            signature.txt
            sha256.txt
      - name: Stage verified Windows installer
        if: inputs.stage_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item online.json windows-online.json
          Copy-Item offline.json windows-offline.json
          gh release upload v3.3.0-rc.2 native/windows/dist/*Setup.exe windows-online.json windows-offline.json signature.txt --clobber
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pillow
      - run: python native/prepare.py
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle -p native/android assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local inference, cache and history on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            adb install native/android/app/build/outputs/apk/debug/app-debug.apk
            adb install native/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w io.github.raphaelflipo.jarvis.test/androidx.test.runner.AndroidJUnitRunner | tee android-test.txt
            adb shell run-as io.github.raphaelflipo.jarvis cat files/online.json > android-online.json
            adb shell run-as io.github.raphaelflipo.jarvis cat files/offline.json > android-offline.json
            python -c "import json; assert json.load(open('android-online.json'))['ok']; assert json.load(open('android-offline.json'))['ok']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/apk/androidTest/debug/*.apk
            android-*.json
            android-test.txt
