name: Jarvis
options:
  bundleIdPrefix: io.github.raphaelflipo
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: io.github.raphaelflipo.jarvis
    MARKETING_VERSION: 3.3.0
    CURRENT_PROJECT_VERSION: 33002
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis.swift
      - path: Assets.xcassets
      - path: app
        type: folder
        buildPhase: resources
      - path: selftest.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: '3.3.0'
        CFBundleVersion: '33002'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            '127.0.0.1':
              NSExceptionAllowsInsecureHTTPLoads: true
        WKAppBoundDomains: ['127.0.0.1', 'localhost']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
